name: Validate portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false -p apps/web/tsconfig.json
      - run: node --test apps/web/test/*.test.cjs
      - run: node --test database/test/*.test.cjs
      - run: npm test
      - run: npm run build
